<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contato | Cantinho dos Jogos</title>
  <meta name="description" content="Envie uma sugestão de jogo ou tire suas dúvidas com o Cantinho dos Jogos.">
  <meta name="author" content="Pedro Pereira">

  <link rel="icon" href="favicon.ico">

  <meta property="og:title" content="Contato | Cantinho dos Jogos">
  <meta property="og:description" content="Sugira um jogo para o catálogo ou envie sua dúvida.">
  <meta property="og:image" content="https://pedrothv.github.io/wdd231/final/imagens/og-cantinho.png">
  <meta property="og:url" content="https://pedrothv.github.io/wdd231/final/contato.html">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Nunito+Sans:wght@400;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="estilos/normalize.css">
  <link rel="stylesheet" href="estilos/telas-pequenas.css">
  <link rel="stylesheet" href="estilos/maior.css">

  <script src="scripts/navegacao.js" defer></script>
  <script src="scripts/data.js" defer></script>
  <script type="module" src="scripts/contato.mjs"></script>
</head>
<body>

  <header>
    <img src="imagens/logo-cantinho.svg" alt="Logotipo do Cantinho dos Jogos" width="32" height="32">
    <span>Cantinho dos Jogos</span>
    <button id="botao-de-nav" class="hamburger" aria-label="Abrir menu de navegação"></button>
  </header>

  <nav id="barra-navegacao" class="navegacao">
    <ul>
      <li><a href="index.html">Início</a></li>
      <li><a href="catalogo.html">Catálogo</a></li>
      <li class="atual"><a href="contato.html">Contato</a></li>
    </ul>
  </nav>

  <main>
    <h1>Contato</h1>
    <p>Quer sugerir um jogo para o catálogo ou tem alguma dúvida? Preencha o formulário abaixo.</p>

    <form method="GET" action="confirmacao.html" class="formulario-contato">
      <label>Nome
        <input type="text" name="nome" required autocomplete="name" title="Seu nome">
      </label>

      <label>E-mail
        <input type="email" name="email" required autocomplete="email" title="Seu e-mail" placeholder="nome@exemplo.com">
      </label>

      <label>Assunto
        <select name="assunto" required title="Escolha o assunto da mensagem">
          <option value="">Escolha uma opção</option>
          <option value="Sugestão de jogo">Sugestão de jogo</option>
          <option value="Dúvida">Dúvida</option>
          <option value="Outro">Outro</option>
        </select>
      </label>

      <label>Mensagem
        <textarea name="mensagem" rows="5" required title="Escreva sua mensagem"></textarea>
      </label>

      <input type="hidden" name="dataEnvio" id="dataEnvio">

      <button type="submit">Enviar mensagem</button>
    </form>
  </main>

  <footer>
    <p>Cantinho dos Jogos</p>
    <p><a href="#">Vídeo de demonstração</a></p>
    <div class="footer-dev">
      <p>&copy; <span id="anoAtual"></span> Pedro Pereira | WDD 231 | Rio de Janeiro, Brasil</p>
      <p id="ultimaModificacao"></p>
    </div>
  </footer>

</body>
</html>
